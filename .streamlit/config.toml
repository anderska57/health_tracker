# App look. Streamlit Cloud reads this file from the repo, so changing a colour
# here and pushing is all it takes. (secrets.toml lives in this folder too, but
# it is gitignored -- only this file gets committed.)

[theme]
base = "light"
backgroundColor = "#DCEDEA"           # soft teal, the page
secondaryBackgroundColor = "#F3F9F8"  # tiles, inputs, buttons
textColor = "#1D3B38"                 # deep teal-slate
primaryColor = "#2F8577"              # Save buttons, checkmarks, selected chips
borderColor = "#B9D6D1"
baseRadius = "0.75rem"
showWidgetBorder = true

